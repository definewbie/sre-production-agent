server.port=8080
spring.application.name=sre-agent-server

# Observability endpoints (Step T)
sre-agent.observability.prometheus-url=http://localhost:9090
sre-agent.observability.alertmanager-url=http://localhost:9093
sre-agent.observability.loki-url=http://localhost:3100
sre-agent.observability.trace-url=http://localhost:16686
sre-agent.observability.trace-backend=jaeger
sre-agent.observability.grafana-url=http://localhost:3000

# Incident intake / normalization
sre-agent.incident.normalization-window-seconds=300

# Demo services (Step U)
sre-agent.demo.order-service-url=http://localhost:18081
sre-agent.demo.payment-service-url=http://localhost:18082
sre-agent.demo.inventory-service-url=http://localhost:18083
