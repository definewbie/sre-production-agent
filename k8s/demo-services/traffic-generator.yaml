apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: demo
  labels:
    app: traffic-generator
    scenario: demo-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-generator
  template:
    metadata:
      labels:
        app: traffic-generator
        scenario: demo-services
    spec:
      containers:
        - name: curl
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Traffic generator started. Targeting order-service:8081/checkout"
              while true; do
                RESPONSE=$(curl -s -w '\n%{http_code}' http://order-service.demo.svc.cluster.local:8081/checkout 2>/dev/null || echo "failed")
                HTTP_CODE=$(echo "$RESPONSE" | tail -1)
                echo "$(date '+%H:%M:%S') status=$HTTP_CODE"
                sleep 1
              done
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
