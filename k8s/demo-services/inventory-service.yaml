apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: demo
  labels:
    app: inventory-service
    scenario: demo-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
        scenario: demo-services
    spec:
      containers:
        - name: inventory-service
          image: sre-agent/inventory-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/app/otel-agent.jar"
            - name: OTEL_SERVICE_NAME
              value: "inventory-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger.observability.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: demo
  labels:
    app: inventory-service
    scenario: demo-services
spec:
  type: ClusterIP
  selector:
    app: inventory-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
