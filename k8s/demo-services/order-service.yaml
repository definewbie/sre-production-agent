apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: demo
  labels:
    app: order-service
    scenario: demo-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        scenario: demo-services
    spec:
      containers:
        - name: order-service
          image: sre-agent/order-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: PAYMENT_URL
              value: "http://payment-service.demo.svc.cluster.local:8082"
            - name: INVENTORY_URL
              value: "http://inventory-service.demo.svc.cluster.local:8083"
            - name: ORDER_TIMEOUT_MS
              value: "1000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: demo
  labels:
    app: order-service
    scenario: demo-services
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
