<text x="220" y="365" class="text">错误率</text><rect x="360" y="345" width="120" height="34" class="ghost"/><text x="380" y="367" class="text">0</text><text x="500" y="367" class="muted">%</text>
<text x="220" y="415" class="text">持续时间</text><rect x="360" y="395" width="120" height="34" class="ghost"/><text x="380" y="417" class="text">5</text><text x="500" y="417" class="muted">分钟</text>
<text x="220" y="465" class="text">流量目标</text><rect x="360" y="445" width="240" height="34" class="ghost"/><text x="380" y="467" class="text">order-service /checkout ▼</text>
<text x="220" y="515" class="text">RPS</text><rect x="360" y="495" width="120" height="34" class="ghost"/><text x="380" y="517" class="text">2</text>
<text x="220" y="565" class="text">观测窗口</text><rect x="360" y="545" width="120" height="34" class="ghost"/><text x="380" y="567" class="text">5</text><text x="500" y="567" class="muted">分钟</text>
<text x="220" y="615" class="text">实验名称</text><rect x="360" y="595" width="300" height="34" class="ghost"/><text x="380" y="617" class="text">payment-latency-test-001</text>
<text x="220" y="665" class="text">实验描述</text><rect x="360" y="645" width="300" height="54" class="ghost"/><text x="380" y="677" class="muted">模拟 payment-service 延迟 1500ms</text>

<rect x="840" y="120" width="380" height="300" class="card"/>
<text x="870" y="160" class="section">实验预览</text>
<text x="870" y="210" class="text">目标服务</text><text x="1030" y="210" class="sub">payment-service</text>
<text x="870" y="250" class="text">故障类型</text><text x="1030" y="250" class="sub">延迟 (Latency)</text>
<text x="870" y="290" class="text">延迟强度</text><text x="1030" y="290" class="sub">1500 ms</text>
<text x="870" y="330" class="text">持续时间</text><text x="1030" y="330" class="sub">5 分钟</text>
<text x="870" y="370" class="text">流量目标</text><text x="1030" y="370" class="sub">order-service /checkout</text>
<text x="870" y="410" class="text">RPS</text><text x="1030" y="410" class="sub">2</text>

<rect x="840" y="450" width="380" height="170" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
<text x="870" y="490" class="section orange">安全提示</text>
<text x="870" y="525" class="text">仅用于演示环境，请谨慎使用故障注入功能。</text>
<text x="870" y="555" class="text">RCA 页面只消费实验结果，不直接控制故障。</text>

<rect x="360" y="760" width="100" height="38" class="ghost"/><text x="383" y="784" class="text">保存配置</text>
<rect x="480" y="760" width="100" height="38" class="button"/><text x="503" y="784" class="button-text">启动实验</text>
<rect x="600" y="760" width="100" height="38" rx="8" fill="#fff" stroke="#fda29b"/><text x="623" y="784" class="bt-red">停止实验</text>
<rect x="720" y="760" width="100" height="38" class="ghost"/><text x="743" y="784" class="text">恢复正常</text>
</svg>