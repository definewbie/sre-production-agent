<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">

<defs>
  <style>
    .bg { fill: #f5f7fb; }
    .card { fill: #ffffff; stroke: #d9e1ec; stroke-width: 1; rx: 12; }
    .sidebar { fill: #0b1522; }
    .nav-active { fill: #0d6efd; rx: 8; }
    .title { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 28px; font-weight: 700; fill: #101828; }
    .section { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 20px; font-weight: 700; fill: #101828; }
    .sub { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 16px; font-weight: 700; fill: #344054; }
    .text { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 14px; fill: #344054; }
    .muted { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 13px; fill: #667085; }
    .small { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 12px; fill: #667085; }
    .nav { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 15px; fill: #d0d5dd; }
    .num { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 32px; font-weight: 700; fill: #111827; }
    .red { fill: #d92d20; }
    .green { fill: #039855; }
    .blue { fill: #0d6efd; }
    .orange { fill: #f79009; }
    .line { stroke: #eaecf0; stroke-width: 1; }
    .arrow { stroke: #f04438; stroke-width: 2; marker-end: url(#arrowhead); }
    .spark-red { fill: none; stroke: #f04438; stroke-width: 2; }
    .spark-blue { fill: none; stroke: #2e90fa; stroke-width: 2; }
    .spark-green { fill: none; stroke: #12b76a; stroke-width: 2; }
    .badge-red { fill: #fee4e2; stroke: #fda29b; }
    .badge-green { fill: #dcfae6; stroke: #75e0a7; }
    .badge-blue { fill: #e0efff; stroke: #84caff; }
    .badge-orange { fill: #fef0c7; stroke: #fedf89; }
    .bt-red { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 700; fill: #b42318; }
    .bt-green { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 700; fill: #027a48; }
    .bt-blue { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 700; fill: #175cd3; }
    .bt-orange { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 700; fill: #b54708; }
    .button { fill: #0d6efd; rx: 8; }
    .button-text { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
    .ghost { fill: #ffffff; stroke: #c8d3e1; rx: 8; }
  </style>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#f04438" />
  </marker>
