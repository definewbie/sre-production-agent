<rect x="190" y="685" width="560" height="145" class="card"/>
<text x="220" y="720" class="section">环境诊断说明</text>
<text x="220" y="755" class="text">• 环境状态用于判断 no_signal 是否由采集组件异常导致。</text>
<text x="220" y="785" class="text">• Prometheus / Loki / Jaeger 均正常时，RCA 证据可信度更高。</text>
<text x="220" y="815" class="text">• 如果某组件异常，RCA 页面必须显式提示该 source 不可靠。</text>

