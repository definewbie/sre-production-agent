<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">

<defs>
  <style>
    .bg { fill: #f5f7fb; }
    .card { fill: #ffffff; stroke: #d9e1ec; stroke-width: 1; rx: 12; }
    .sidebar { fill: #0b1522; }
    .nav-active { fill: #0d6efd; rx: 8; }
    .title { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 28px; font-weight: 700; fill: #101828; }
    .section { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 20px; font-weight: 700; fill: #101828; }
    .sub { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 16px; font-weight: 700; fill: #344054; }
    .text { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 14px; fill: #344054; }
    .muted { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 13px; fill: #667085; }
    .small { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 12px; fill: #667085; }
    .nav { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 15px; fill: #d0d5dd; }
    .num { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 32px; font-weight: 700; fill: #111827; }
    .red { fill: #d92d20; }
    .green { fill: #039855; }
    .blue { fill: #0d6efd; }
    .orange { fill: #f79009; }
    .line { stroke: #eaecf0; stroke-width: 1; }
    .badge-red { fill: #fee4e2; stroke: #fda29b; }
    .badge-green { fill: #dcfae6; stroke: #75e0a7; }
    .badge-blue { fill: #e0efff; stroke: #84caff; }
    .badge-orange { fill: #fef0c7; stroke: #fedf89; }
    .bt-red { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 700; fill: #b42318; }
    .bt-green { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 700; fill: #027a48; }
    .bt-blue { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 700; fill: #175cd3; }
    .bt-orange { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 700; fill: #b54708; }
    .button { fill: #0d6efd; rx: 8; }
    .button-text { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
    .ghost { fill: #ffffff; stroke: #c8d3e1; rx: 8; }
    .input { fill: #ffffff; stroke: #c8d3e1; rx: 6; }
    .toggle-on { fill: #0d6efd; }
    .toggle-off { fill: #d0d5dd; }
  </style>
</defs>

<rect class="bg" x="0" y="0" width="1440" height="900"/>
<rect class="sidebar" x="0" y="0" width="160" height="900"/>
<text x="24" y="42" class="section" fill="#fff">SRE Agent</text>
<text x="36" y="86" class="nav">服务健康</text><text x="36" y="134" class="nav">RCA 分析</text><text x="36" y="182" class="nav">证据明细</text><text x="36" y="230" class="nav">Chaos 实验</text><text x="36" y="278" class="nav">环境状态</text><rect x="16" y="304" width="128" height="36" class="nav-active"/><text x="36" y="326" class="nav" fill="#fff">设置</text>
<text x="24" y="745" class="small" fill="#98a2b3">环境</text>
<text x="24" y="772" class="nav">local-kind-demo</text>
<circle cx="132" cy="767" r="5" fill="#12b76a"/>
<text x="24" y="820" class="small" fill="#98a2b3">2025-05-20 14:30:25</text>
<text x="190" y="48" class="title">7 设置</text>

<text x="190" y="85" class="small">设置 ＞ 时间窗口 / API / 显示偏好</text>
<rect x="1160" y="25" width="90" height="34" class="ghost"/><text x="1180" y="47" class="muted">重置</text>
<rect x="1265" y="25" width="90" height="34" class="button"/><text x="1285" y="47" class="button-text">保存</text>

<rect x="190" y="120" width="540" height="330" class="card"/>
<text x="220" y="160" class="section">时间窗口默认值</text>
<text x="220" y="210" class="text">故障注入后等待</text><rect x="410" y="190" width="120" height="34" class="input"/><text x="432" y="212" class="text">30</text><text x="545" y="212" class="muted">秒 waitSeconds</text>
<text x="220" y="260" class="text">证据查询窗口</text><rect x="410" y="240" width="120" height="34" class="input"/><text x="432" y="262" class="text">300</text><text x="545" y="262" class="muted">秒 lookbackSeconds</text>
<text x="220" y="310" class="text">查询粒度</text><rect x="410" y="290" width="120" height="34" class="input"/><text x="432" y="312" class="text">15</text><text x="545" y="312" class="muted">秒 stepSeconds</text>
<text x="220" y="365" class="small">说明：真实 RCA 需要覆盖 scrape / ingestion / trace 写入延迟，不建议使用过短窗口。</text>

<rect x="780" y="120" width="540" height="330" class="card"/>
<text x="810" y="160" class="section">API 与环境</text>
<text x="810" y="210" class="text">API Base URL</text><rect x="980" y="190" width="260" height="34" class="input"/><text x="998" y="212" class="text">http://localhost:8080</text>
<text x="810" y="260" class="text">环境名称</text><rect x="980" y="240" width="260" height="34" class="input"/><text x="998" y="262" class="text">local-kind-demo</text>
<text x="810" y="310" class="text">刷新间隔</text><rect x="980" y="290" width="120" height="34" class="input"/><text x="998" y="312" class="text">30</text><text x="1115" y="312" class="muted">秒</text>
<text x="810" y="365" class="small">说明：第一版可使用 mock data，后续逐区接入真实 API。</text>

<rect x="190" y="485" width="540" height="260" class="card"/>
<text x="220" y="525" class="section">显示偏好</text>
<text x="220" y="575" class="text">自动刷新</text><rect x="410" y="555" width="44" height="24" rx="12" class="toggle-on"/><circle cx="435" cy="567" r="9" fill="#fff"/>
<text x="220" y="625" class="text">显示 Raw Evidence</text><rect x="410" y="605" width="44" height="24" rx="12" class="toggle-off"/><circle cx="422" cy="617" r="9" fill="#fff"/>
<text x="220" y="675" class="text">启用 Mock Data</text><rect x="410" y="655" width="44" height="24" rx="12" class="toggle-on"/><circle cx="435" cy="667" r="9" fill="#fff"/>
<text x="220" y="720" class="small">说明：mock data 必须明确标记，不能伪装成真实 API 数据。</text>

<rect x="780" y="485" width="540" height="260" class="card"/>
<text x="810" y="525" class="section">告警与阈值</text>
<text x="810" y="575" class="text">错误率异常阈值</text><rect x="1020" y="555" width="120" height="34" class="input"/><text x="1040" y="577" class="text">1.0</text><text x="1155" y="577" class="muted">%</text>
<text x="810" y="625" class="text">P95 延迟异常阈值</text><rect x="1020" y="605" width="120" height="34" class="input"/><text x="1040" y="627" class="text">1000</text><text x="1155" y="627" class="muted">ms</text>
<text x="810" y="675" class="text">RCA 分数差阈值</text><rect x="1020" y="655" width="120" height="34" class="input"/><text x="1040" y="677" class="text">0.10</text>
<text x="810" y="720" class="small">说明：阈值第一版仅用于前端展示，后续接入后端配置。</text>
</svg>
